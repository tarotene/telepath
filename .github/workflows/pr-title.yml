name: PR title

# Validates PR titles against the Conventional Commits contract that
# tarotene/dotfiles' ADR-0031 establishes: this repository uses squash-merge
# (enforced by the Workflow Ruleset), and on squash-merge GitHub uses the PR
# title as the commit message on the default branch — enforcing the PR
# title therefore enforces the entire commit history convention without
# per-commit pre-push hooks.
#
# The grammar itself lives in exactly one place — crates/pr-title-check in
# tarotene/dotfiles — invoked here via a composite action
# (tarotene/dotfiles/.github/actions/pr-title) so this repository never
# carries its own copy of the type list / regex. See docs/claude/
# pr-title-contract.md in tarotene/dotfiles for the full design.
#
# ADR-591 (docs/adr/591-ci-workflow-naming.md D3) replaced an earlier
# `workflow_call` reusable-workflow form with this composite action. GitHub
# names a reusable-workflow job's check run "<caller job's name> / <called
# job's name>" regardless of either workflow's own `name:` (confirmed
# against tarotene/telepath#243, 2026-09-26) — a misunderstanding of that
# concatenation rule caused #337's rollout to seed a required-status-check
# context this job could never satisfy. A composite action runs as steps
# inside THIS job, so the reported check-run name is simply this job's own
# `name:` ("PR title") — the concatenation-mismatch failure mode is
# structurally gone, not just fixed.
#
# As a side effect: since this check only fires on pull_request events, it
# will never be reported for direct pushes to main — those are
# blocked by the Quality Ruleset's required_status_checks instead (context
# never reported → push rejected). This effectively enforces a PR-only
# workflow.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    permissions:
      # The action's own steps need `contents: write` (to read this
      # repository's merge settings — see pr-merge-settings-check's own
      # comment) and `actions: read` (to read this run's jobs, for the
      # required-check context self-check). A composite action cannot
      # declare its own `permissions:` block (only a job can), so both
      # scopes must be declared here explicitly rather than left to this
      # repository's default Actions workflow permissions. A repository
      # whose default is read-only makes the call fail outright with
      # `startup_failure` (confirmed against tarotene/bleep#33,
      # 2026-09-26); a repository whose default happens to be read/write
      # only worked by accident.
      contents: write
      actions: read
    steps:
      - uses: tarotene/dotfiles/.github/actions/pr-title@main
        with:
          title: ${{ github.event.pull_request.title }}
